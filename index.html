<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <title>الموقع بتاعي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="content-container">
        <h1>أهلاً بك في موقعي الأول</h1>
        انا زياد سليمان محمود
        <p id="myText">أنا أتعلم الآن كيف أقوم بإنشاء موقع ويب.</p>
        
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="صورة لوجو جوجل">
        
        <br><br> 
        
        <button onclick="changeText()" class="action-button">دوس هنا عشان تغير الكلام</button>
    </div>


    <div class="speaker-section">
        <button id="speakerButton" class="main-button blue-button">
            اضغط لبدء تنظيف السماعة
        </button>
    </div>
    <audio id="toneAudio" src="tone.mp3" preload="auto"></audio>

    
    <script>
        // 1. كود وظيفة تغيير النص الأصلي
        function changeText() {
            document.getElementById("myText").innerHTML = "مبروك! إنت عملت أول تطبيق ويب!";
        }  

        // 2. كود وظيفة تشغيل نغمة التنظيف (مع تزويد مستوى الصوت)
        const speakerButton = document.getElementById('speakerButton');
        const audio = document.getElementById('toneAudio');

        speakerButton.addEventListener('click', function() {
            // ✅ الكود الذي يضمن رفع مستوى الصوت إلى الأقصى (1.0)
            audio.volume = 1.0; 
            
            audio.play()
                .then(() => {
                    speakerButton.textContent = 'جاري التنظيف... لا تغلق الصفحة';
                    speakerButton.classList.add('playing');
                })
                .catch(error => {
                    // هذا التنبيه يظهر بسبب قيود المتصفحات التي تحدثنا عنها
                    alert('فشل التشغيل، تأكد من أن هاتفك ليس على وضع الصامت وقم برفع مستوى الصوت يدوياً.');
                });
            
            // إيقاف الصوت بعد 10 ثوانٍ (يمكنك تغيير المدة)
            setTimeout(() => {
                audio.pause();
                audio.currentTime = 0;
                speakerButton.textContent = 'اضغط لبدء تنظيف السماعة';
                speakerButton.classList.remove('playing');
            }, 10000); // 10 ثوانٍ
        });
    </script>

    s0.parentNode.insertBefore(s1,s0);
    })();
    </script>
    </body>
</html>
